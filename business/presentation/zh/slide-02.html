<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt; height: 500pt;
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: #1a1e2e;
    padding: 32pt 44pt;
    overflow: hidden;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .section-label { font-size: 9pt; color: #c9a96e; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; }
  .page-title { font-size: 32pt; font-weight: 700; color: #e0ddd5; margin-top: 4pt; }
  .gold-bar { width: 50pt; height: 3pt; background: #c9a96e; margin: 12pt 0 20pt 0; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .item {
    display: flex; align-items: center; gap: 14pt;
    padding: 14pt 18pt;
    border-top: 1px solid rgba(255,255,255,0.08);
    background: #252a3a;
  }
  .item:nth-child(odd) { border-right: 1px solid rgba(255,255,255,0.06); }
  .num {
    width: 36pt; height: 36pt;
    display: flex; align-items: center; justify-content: center;
    font-size: 13pt; font-weight: 700; color: #fff;
    border-radius: 4pt; flex-shrink: 0;
  }
  .num-blue { background: #6b8fad; }
  .num-gold { background: #b49a64; }
  .item-text .item-title { font-size: 12pt; font-weight: 600; color: #e0ddd5; }
  .item-text .item-sub { font-size: 8.5pt; color: #8b8a85; margin-top: 2pt; }
</style>
</head>
<body>
  <div class="section-label">CONTENTS</div>
  <div class="page-title">目录</div>
  <div class="gold-bar"></div>
  <div class="grid">
    <div class="item">
      <div class="num num-blue">01</div>
      <div class="item-text">
        <div class="item-title">项目概述</div>
        <div class="item-sub">什么是 BizSim?</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-gold">02</div>
      <div class="item-text">
        <div class="item-title">市场痛点与解法</div>
        <div class="item-sub">AI时代的验证困境</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-blue">03</div>
      <div class="item-text">
        <div class="item-title">产品核心</div>
        <div class="item-sub">8种Agent × 14个功能模块</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-gold">04</div>
      <div class="item-text">
        <div class="item-title">商业模式</div>
        <div class="item-sub">双轮驱动的高毛利结构</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-blue">05</div>
      <div class="item-text">
        <div class="item-title">市场分析</div>
        <div class="item-sub">澳洲市场的空白机会</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-gold">06</div>
      <div class="item-text">
        <div class="item-title">技术优势</div>
        <div class="item-sub">大规模Agent模拟引擎</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-blue">07</div>
      <div class="item-text">
        <div class="item-title">创始团队</div>
        <div class="item-sub">学术背景 × 创业实践</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-gold">08</div>
      <div class="item-text">
        <div class="item-title">竞争优势</div>
        <div class="item-sub">核心壁垒与差异化</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-blue">09</div>
      <div class="item-text">
        <div class="item-title">里程碑与愿景</div>
        <div class="item-sub">发展路线图</div>
      </div>
    </div>
    <div class="item">
      <div class="num num-gold" style="background: transparent; border: 1px solid rgba(201,169,110,0.4);">☆</div>
      <div class="item-text">
        <div class="item-title" style="color: #c9a96e;">愿景</div>
        <div class="item-sub">让每个创业想法都能验证</div>
      </div>
    </div>
  </div>
</body>
</html>
