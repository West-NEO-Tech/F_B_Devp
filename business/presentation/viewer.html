<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizSim — Business Plan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111520; font-family: system-ui, sans-serif; }
  #viewer {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  #frame-wrap {
    width: 960px; height: 667px; /* 720pt × 500pt */
    transform-origin: center center;
  }
  iframe {
    border: none;
    width: 960px; height: 667px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.5);
    border-radius: 4px;
    display: block;
    background: #1a1e2e;
  }
  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: rgba(30,34,48,0.94);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 16px;
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  .controls button {
    background: none; border: none; color: #e0ddd5; font-size: 18px;
    cursor: pointer; padding: 4px 10px; border-radius: 4px;
    transition: background 0.15s;
  }
  .controls button:hover { background: rgba(255,255,255,0.1); }
  .controls button:disabled { opacity: 0.3; cursor: default; }
  .counter { color: #8b8a85; font-size: 13px; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
  .btn-pdf {
    background: none; border: 1px solid rgba(201,169,110,0.4); color: #c9a96e;
    font-size: 12px; cursor: pointer; padding: 4px 12px; border-radius: 4px;
    margin-left: 8px; transition: background 0.15s;
  }
  .btn-pdf:hover { background: rgba(201,169,110,0.12); }
  .hint { position: fixed; top: 14px; right: 18px; color: #555; font-size: 11px; z-index: 10; }
</style>
</head>
<body>
<div id="viewer">
  <div id="frame-wrap">
    <iframe id="slide"></iframe>
  </div>
</div>
<div class="controls">
  <button id="prev" title="Previous (←)">◀</button>
  <span class="counter" id="counter"></span>
  <button id="next" title="Next (→)">▶</button>
  <button class="btn-pdf" id="pdfBtn" title="打开打印视图，可导出 PDF">📄 PDF</button>
  <button class="btn-pdf" id="langBtn" title="切换语言 / Switch Language">🌐 EN</button>
</div>
<div class="hint" id="hint">← → 键翻页 · F 全屏 · L 切换语言</div>
<script>
  const TOTAL = 13;
  const SLIDE_W = 960;
  const SLIDE_H = 667;
  let current = 1;

  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'en' ? 'en' : 'zh';

  const iframe = document.getElementById('slide');
  const wrap = document.getElementById('frame-wrap');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const langBtn = document.getElementById('langBtn');
  const hint = document.getElementById('hint');

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateLangUI() {
    langBtn.textContent = lang === 'zh' ? '🌐 EN' : '🌐 中文';
    hint.textContent = lang === 'zh'
      ? '← → 键翻页 · F 全屏 · L 切换语言'
      : '← → navigate · F fullscreen · L switch language';
  }

  function fitSlide() {
    const vw = window.innerWidth - 40;
    const vh = window.innerHeight - 80;
    const scale = Math.min(vw / SLIDE_W, vh / SLIDE_H, 1);
    wrap.style.transform = `scale(${scale})`;
  }

  function go(n) {
    current = Math.max(1, Math.min(TOTAL, n));
    iframe.src = `${lang}/slide-${pad(current)}.html`;
    counter.textContent = `${current} / ${TOTAL}`;
    prevBtn.disabled = current === 1;
    nextBtn.disabled = current === TOTAL;
  }

  function switchLang() {
    lang = lang === 'zh' ? 'en' : 'zh';
    const url = new URL(location);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url);
    updateLangUI();
    go(current);
  }

  prevBtn.addEventListener('click', () => go(current - 1));
  nextBtn.addEventListener('click', () => go(current + 1));
  langBtn.addEventListener('click', switchLang);
  document.getElementById('pdfBtn').addEventListener('click', () => {
    window.open(`print.html?lang=${lang}`, '_blank');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(current - 1); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(current + 1); }
    if (e.key === 'Home') go(1);
    if (e.key === 'End') go(TOTAL);
    if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
    if (e.key === 'l' || e.key === 'L') switchLang();
  });
  window.addEventListener('resize', fitSlide);
  updateLangUI();
  fitSlide();
  go(1);
</script>
</body>
</html>
