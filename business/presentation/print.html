<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizSim BP — Print / PDF Export</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #222; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #222; padding: 0; margin: 0; }
  #container { max-width: 980px; margin: 0 auto; padding: 20px 0; }
  .slide-frame {
    display: block;
    width: 960px; height: 667px; /* 720pt × 500pt */
    border: none;
    margin: 0 auto 16px auto;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    border-radius: 4px;
    background: #1a1e2e;
    break-after: page;
  }
  .slide-frame:last-of-type { margin-bottom: 0; break-after: auto; }
  .page-num {
    text-align: center; color: #555; font-family: system-ui, sans-serif;
    font-size: 11px; padding: 2px 0 12px 0;
  }
  .toolbar {
    position: fixed; top: 16px; right: 16px; z-index: 50;
    display: flex; gap: 8px;
  }
  .toolbar button {
    background: rgba(30,34,48,0.94); border: 1px solid rgba(255,255,255,0.12);
    color: #e0ddd5; font-size: 13px; padding: 6px 16px; border-radius: 6px;
    cursor: pointer; font-family: system-ui, sans-serif;
    backdrop-filter: blur(10px); transition: background 0.15s;
  }
  .toolbar button:hover { background: rgba(50,54,68,0.94); }
  .toolbar .btn-gold { border-color: rgba(201,169,110,0.4); color: #c9a96e; }
  .toolbar .btn-gold:hover { background: rgba(201,169,110,0.12); }

  @media print {
    html, body { background: #111520; }
    .toolbar, .page-num { display: none !important; }
    #container { padding: 0; max-width: none; }
    .slide-frame {
      margin: 0; box-shadow: none; border-radius: 0;
      width: 100vw; height: 100vh;
      break-after: page;
      page-break-after: always;
    }
    .slide-frame:last-of-type { break-after: auto; page-break-after: auto; }
  }
  @page { size: 960px 667px; margin: 0; }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.history.back()">← 返回</button>
  <button class="btn-gold" onclick="window.print()">🖨 打印 / 导出 PDF</button>
</div>
<div id="container">
  <script>
    const TOTAL = 13;
    const params = new URLSearchParams(location.search);
    const lang = params.get('lang') === 'en' ? 'en' : 'zh';
    function pad(n) { return String(n).padStart(2, '0'); }
    for (let i = 1; i <= TOTAL; i++) {
      document.write(`<iframe class="slide-frame" src="${lang}/slide-${pad(i)}.html"></iframe>`);
      document.write(`<div class="page-num">— ${i} / ${TOTAL} —</div>`);
    }
  </script>
</div>
</body>
</html>
