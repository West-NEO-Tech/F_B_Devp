services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bizsim
      POSTGRES_PASSWORD: bizsim_dev
      POSTGRES_DB: bizsim
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizsim"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://bizsim:bizsim_dev@db:5432/bizsim
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
      APP_VERSION: "0.1.0"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      # LLM configuration — override via .env or environment for AI features
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-sk-no-key}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8100"

volumes:
  pgdata:
