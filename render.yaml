services:
  - type: web
    name: bizsim-server
    runtime: python
    plan: free
    rootDir: development/server
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: APP_VERSION
        value: 0.1.0
      - key: DATABASE_URL
        fromDatabase:
          name: bizsim-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bizsim-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'

  - type: redis
    name: bizsim-redis
    ipAllowList: []
    plan: free

databases:
  - name: bizsim-postgres
    plan: free
